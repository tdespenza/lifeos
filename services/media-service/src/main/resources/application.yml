spring:
  application:
    name: media-service
  threads:
    virtual:
      enabled: true
  datasource:
    # Media never falls back to an embedded or shared production database.
    url: ${MEDIA_DATASOURCE_URL}
    username: ${MEDIA_DATASOURCE_USERNAME}
    password: ${MEDIA_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${MEDIA_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${MEDIA_FLYWAY_BASELINE_VERSION:1}
    validate-migration-naming: true
  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: ${MEDIA_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MEDIA_MULTIPART_MAX_REQUEST_SIZE:51MB}
      file-size-threshold: 0B

server:
  port: ${MEDIA_SERVICE_PORT:8089}

media:
  task-goal:
    base-url: ${LIFEOS_TASK_GOAL_BASE_URL:http://localhost:8082}
    workload-identity: ${MEDIA_TASK_GOAL_WORKLOAD_IDENTITY:media-service}
    workload-token: ${MEDIA_TASK_GOAL_WORKLOAD_TOKEN:}
    connect-timeout: ${MEDIA_TASK_GOAL_CONNECT_TIMEOUT:2s}
    read-timeout: ${MEDIA_TASK_GOAL_READ_TIMEOUT:5s}
    max-concurrent-requests: ${MEDIA_TASK_GOAL_MAX_CONCURRENT_REQUESTS:8}
  trust-ledger:
    base-url: ${LIFEOS_TRUST_LEDGER_BASE_URL:http://localhost:8087}
    workload-identity: ${MEDIA_TRUST_LEDGER_WORKLOAD_IDENTITY:media-service}
    workload-token: ${MEDIA_TRUST_LEDGER_WORKLOAD_TOKEN:}
    connect-timeout: ${MEDIA_TRUST_LEDGER_CONNECT_TIMEOUT:2s}
    read-timeout: ${MEDIA_TRUST_LEDGER_READ_TIMEOUT:5s}
    max-concurrent-requests: ${MEDIA_TRUST_LEDGER_MAX_CONCURRENT_REQUESTS:8}
  idempotency-secret: ${MEDIA_IDEMPOTENCY_SECRET}
  audit-client-fingerprint-secret: ${MEDIA_AUDIT_CLIENT_FINGERPRINT_SECRET}
  development-signaling-secret: ${MEDIA_DEVELOPMENT_SIGNALING_SECRET}
  session-expiry:
    enabled: ${MEDIA_SESSION_EXPIRY_ENABLED:true}
    poll-delay: ${MEDIA_SESSION_EXPIRY_POLL_DELAY:1s}
  inbound-request-timeout: ${MEDIA_INBOUND_REQUEST_TIMEOUT:30s}
  upload-deadline: ${MEDIA_UPLOAD_DEADLINE:60s}
  max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:52428800}
  max-inbound-body-bytes: ${MEDIA_MAX_INBOUND_BODY_BYTES:53477376}
  max-concurrent-requests: ${MEDIA_MAX_CONCURRENT_REQUESTS:32}
  storage:
    mode: ${MEDIA_STORAGE_MODE:EXTERNAL_OBJECT_STORE_REQUIRED}
    local-root: ${MEDIA_LOCAL_STORAGE_ROOT:./var/media-objects}
  signaling:
    mode: ${MEDIA_SIGNALING_MODE:EXTERNAL_SFU_REQUIRED}
    credential-ttl: ${MEDIA_SIGNALING_CREDENTIAL_TTL:2m}
    max-concurrent-requests: ${MEDIA_SIGNALING_MAX_CONCURRENT_REQUESTS:16}
    max-session-duration: ${MEDIA_MAX_SESSION_DURATION:4h}
    max-schedule-ahead: ${MEDIA_MAX_SCHEDULE_AHEAD:366d}
  processing:
    mode: ${MEDIA_PROCESSING_MODE:EXTERNAL_WORKER_REQUIRED}
    executable: ${MEDIA_PROCESSING_EXECUTABLE:ffmpeg}
    timeout: ${MEDIA_PROCESSING_TIMEOUT:60s}
    max-concurrent-jobs: ${MEDIA_PROCESSING_MAX_CONCURRENT_JOBS:2}

identity:
  base-url: ${LIFEOS_IDENTITY_BASE_URL:http://localhost:8081}
  workload-identity: ${LIFEOS_WORKLOAD_IDENTITY:media-service}
  workload-token: ${IDENTITY_MEDIA_WORKLOAD_TOKEN}
  expected-policy-version: ${LIFEOS_AUTHORIZATION_POLICY_VERSION:v2}
  connect-timeout: ${MEDIA_IDENTITY_CONNECT_TIMEOUT:2s}
  read-timeout: ${MEDIA_IDENTITY_READ_TIMEOUT:3s}
  max-concurrent-requests: ${MEDIA_IDENTITY_MAX_CONCURRENT_REQUESTS:32}

management:
  server:
    port: ${MEDIA_MANAGEMENT_PORT:9089}
    address: ${MEDIA_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
