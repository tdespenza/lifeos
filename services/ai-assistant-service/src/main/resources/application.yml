spring:
  application:
    name: ai-assistant-service
  kafka:
    bootstrap-servers: ${LIFEOS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  threads:
    virtual:
      enabled: true
  datasource:
    # Production deployments must provide these through the deployment secret source. A blank
    # value fails validated property binding before a JDBC pool or Flyway migration can start.
    url: ${AI_ASSISTANT_DATASOURCE_URL}
    username: ${AI_ASSISTANT_DATASOURCE_USERNAME}
    password: ${AI_ASSISTANT_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${AI_ASSISTANT_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${AI_ASSISTANT_FLYWAY_BASELINE_VERSION:1}
    validate-migration-naming: true

server:
  port: ${AI_ASSISTANT_SERVICE_PORT:8090}

ai-assistant:
  inbound-request-timeout: ${AI_ASSISTANT_INBOUND_REQUEST_TIMEOUT:8s}
  max-inbound-body-bytes: ${AI_ASSISTANT_MAX_INBOUND_BODY_BYTES:16384}
  max-concurrent-requests: ${AI_ASSISTANT_MAX_CONCURRENT_REQUESTS:64}
  max-message-characters: ${AI_ASSISTANT_MAX_MESSAGE_CHARACTERS:4096}
  max-estimated-input-tokens: ${AI_ASSISTANT_MAX_ESTIMATED_INPUT_TOKENS:2048}
  max-output-tokens: ${AI_ASSISTANT_MAX_OUTPUT_TOKENS:512}
  max-concurrent-generations: ${AI_ASSISTANT_MAX_CONCURRENT_GENERATIONS:16}
  provider-timeout: ${AI_ASSISTANT_PROVIDER_TIMEOUT:5s}
  audit-hmac-secret: ${AI_ASSISTANT_AUDIT_HMAC_SECRET}
  audit-outbox:
    relay-enabled: ${AI_ASSISTANT_AUDIT_OUTBOX_RELAY_ENABLED:false}
    poll-delay: ${AI_ASSISTANT_AUDIT_OUTBOX_POLL_DELAY:1s}
    lease-duration: ${AI_ASSISTANT_AUDIT_OUTBOX_LEASE_DURATION:30s}
    initial-backoff: ${AI_ASSISTANT_AUDIT_OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${AI_ASSISTANT_AUDIT_OUTBOX_MAX_BACKOFF:1m}
    publish-timeout: ${AI_ASSISTANT_AUDIT_OUTBOX_PUBLISH_TIMEOUT:5s}
    batch-size: ${AI_ASSISTANT_AUDIT_OUTBOX_BATCH_SIZE:32}
    max-concurrent-publishes: ${AI_ASSISTANT_AUDIT_OUTBOX_MAX_CONCURRENT_PUBLISHES:4}
    max-attempts: ${AI_ASSISTANT_AUDIT_OUTBOX_MAX_ATTEMPTS:5}
  # Raw conversation content remains disabled unless a deployment supplies MongoDB and a
  # base64-encoded AES-256 key. The enabled adapter encrypts content before persistence and
  # applies bounded entry counts plus TTL retention; disabled reads fail closed.
  conversation-history:
    enabled: ${AI_ASSISTANT_MONGODB_HISTORY_ENABLED:false}
    uri: ${AI_ASSISTANT_MONGODB_URI:mongodb://localhost:27017/lifeos_ai_history}
    database: ${AI_ASSISTANT_MONGODB_DATABASE:lifeos_ai_history}
    encryption-key: ${AI_ASSISTANT_MONGODB_ENCRYPTION_KEY:}
    collection: ${AI_ASSISTANT_MONGODB_COLLECTION:conversation_messages}
    max-entries-per-conversation: ${AI_ASSISTANT_MONGODB_MAX_ENTRIES:100}
    retention-days: ${AI_ASSISTANT_MONGODB_RETENTION_DAYS:30}
    max-entry-bytes: ${AI_ASSISTANT_MONGODB_MAX_ENTRY_BYTES:32768}
    connect-timeout: ${AI_ASSISTANT_MONGODB_CONNECT_TIMEOUT:2s}
  provider:
    # The default is deliberately inert. LOCAL_DETERMINISTIC is a dependency-free extractive
    # development provider; OPENAI_COMPATIBLE is opt-in for a reviewed local or remote endpoint.
    # Non-loopback endpoints must use HTTPS and all responses are byte-bounded.
    mode: ${AI_ASSISTANT_PROVIDER_MODE:DISABLED}
    base-url: ${AI_ASSISTANT_PROVIDER_BASE_URL:http://localhost:11434/v1}
    completion-path: ${AI_ASSISTANT_PROVIDER_COMPLETION_PATH:/chat/completions}
    api-key: ${AI_ASSISTANT_PROVIDER_API_KEY:}
    model: ${AI_ASSISTANT_PROVIDER_MODEL:llama3.2}
    max-response-bytes: ${AI_ASSISTANT_PROVIDER_MAX_RESPONSE_BYTES:262144}

assistant:
  task-goal-tool:
    base-url: ${AI_ASSISTANT_TASK_GOAL_BASE_URL:http://localhost:8082}
    workload-identity: ${AI_ASSISTANT_TASK_GOAL_WORKLOAD_IDENTITY:ai-assistant-service}
    workload-token: ${TASK_GOAL_AI_ASSISTANT_WORKLOAD_TOKEN:}
    connect-timeout: ${AI_ASSISTANT_TASK_GOAL_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_ASSISTANT_TASK_GOAL_READ_TIMEOUT:5s}
    max-concurrent-requests: ${AI_ASSISTANT_TASK_GOAL_MAX_CONCURRENT_REQUESTS:8}
  finance-tool:
    base-url: ${AI_ASSISTANT_FINANCE_BASE_URL:http://localhost:8086}
    workload-identity: ${AI_ASSISTANT_FINANCE_WORKLOAD_IDENTITY:ai-assistant-service}
    workload-token: ${FINANCE_AI_ASSISTANT_WORKLOAD_TOKEN:}
    connect-timeout: ${AI_ASSISTANT_FINANCE_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_ASSISTANT_FINANCE_READ_TIMEOUT:5s}
    max-concurrent-requests: ${AI_ASSISTANT_FINANCE_MAX_CONCURRENT_REQUESTS:4}
  profile-tool:
    base-url: ${AI_ASSISTANT_PROFILE_BASE_URL:http://localhost:8083}
    workload-identity: ${AI_ASSISTANT_PROFILE_WORKLOAD_IDENTITY:ai-assistant-service}
    workload-token: ${PROFILE_AI_ASSISTANT_WORKLOAD_TOKEN:}
    connect-timeout: ${AI_ASSISTANT_PROFILE_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_ASSISTANT_PROFILE_READ_TIMEOUT:5s}
    max-concurrent-requests: ${AI_ASSISTANT_PROFILE_MAX_CONCURRENT_REQUESTS:4}
  analytics-tool:
    base-url: ${AI_ASSISTANT_ANALYTICS_BASE_URL:http://localhost:8091}
    workload-identity: ${AI_ASSISTANT_ANALYTICS_WORKLOAD_IDENTITY:ai-assistant-service}
    workload-token: ${ANALYTICS_AI_ASSISTANT_WORKLOAD_TOKEN:}
    gateway-proof-secret: ${AI_ASSISTANT_ANALYTICS_GATEWAY_PROOF_SECRET:}
    connect-timeout: ${AI_ASSISTANT_ANALYTICS_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_ASSISTANT_ANALYTICS_READ_TIMEOUT:5s}
    max-concurrent-requests: ${AI_ASSISTANT_ANALYTICS_MAX_CONCURRENT_REQUESTS:4}

qdrant:
  # Disabled until a deployment supplies the reviewed vector service. When enabled, every query
  # is filtered by owner_account_id and a vector outage fails closed; no PostgreSQL full scan is used.
  enabled: ${QDRANT_ENABLED:false}
  base-url: ${QDRANT_BASE_URL:http://localhost:6333}
  collection: ${QDRANT_COLLECTION:lifeos_documents_v1}
  api-key: ${QDRANT_API_KEY:}
  vector-size: ${QDRANT_VECTOR_SIZE:32}
  max-results: ${QDRANT_MAX_RESULTS:8}
  max-chunks-per-document: ${QDRANT_MAX_CHUNKS_PER_DOCUMENT:64}
  max-chunk-characters: ${QDRANT_MAX_CHUNK_CHARACTERS:1600}
  timeout: ${QDRANT_TIMEOUT:2s}

identity:
  # Identity only permits HTTP for loopback development. The inbound bearer is validated by a
  # workload-authenticated call and never logged or persisted by this service.
  base-url: ${LIFEOS_IDENTITY_BASE_URL:http://localhost:8081}
  workload-identity: ${LIFEOS_WORKLOAD_IDENTITY:ai-assistant-service}
  workload-token: ${IDENTITY_AI_ASSISTANT_WORKLOAD_TOKEN}
  connect-timeout: ${AI_ASSISTANT_IDENTITY_CONNECT_TIMEOUT:2s}
  read-timeout: ${AI_ASSISTANT_IDENTITY_READ_TIMEOUT:3s}
  max-concurrent-requests: ${AI_ASSISTANT_IDENTITY_MAX_CONCURRENT_REQUESTS:32}

management:
  server:
    port: ${AI_ASSISTANT_MANAGEMENT_PORT:9090}
    address: ${AI_ASSISTANT_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
