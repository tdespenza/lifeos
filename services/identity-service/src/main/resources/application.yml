spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${IDENTITY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifeos_identity}
    username: ${IDENTITY_DATASOURCE_USERNAME:lifeos}
    password: ${IDENTITY_DATASOURCE_PASSWORD:lifeos}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081

management:
  server:
    port: ${IDENTITY_MANAGEMENT_PORT:9081}
    address: ${IDENTITY_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
