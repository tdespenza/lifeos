syntax = "proto3";

package lifeos.finance.v1;

import "google/protobuf/timestamp.proto";
import "lifeos/common/v1/request_metadata.proto";

option java_multiple_files = true;
option java_outer_classname = "FinanceSummaryProto";
option java_package = "com.lifeos.grpc.finance.v1";

service FinanceSummaryService {
  rpc GetPeriodSummary(GetPeriodSummaryRequest) returns (GetPeriodSummaryResponse);
}

message GetPeriodSummaryRequest {
  lifeos.common.v1.RequestMetadata metadata = 1;
  string owner_account_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
}

message GetPeriodSummaryResponse {
  string currency = 1;
  sint64 income_minor_units = 2;
  sint64 expense_minor_units = 3;
  sint64 net_minor_units = 4;
}
