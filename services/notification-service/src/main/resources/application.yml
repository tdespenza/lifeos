spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    # No deployment credential defaults: an incomplete deployment must fail before it can write
    # inbox, outbox, endpoint, or delivery state.
    url: ${NOTIFICATION_DATASOURCE_URL}
    username: ${NOTIFICATION_DATASOURCE_USERNAME}
    password: ${NOTIFICATION_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${NOTIFICATION_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${NOTIFICATION_FLYWAY_BASELINE_VERSION:1}
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${LIFEOS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_CONSUMER_GROUP:notification-service-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      # Broker offsets advance only after the inbox transaction succeeds or the bounded DLT policy
      # has safely recovered a poison record.
      ack-mode: record

server:
  port: ${NOTIFICATION_SERVICE_PORT:8084}

notification:
  # Base64-encoded 256-bit AES-GCM key from secret management; no source-controlled fallback.
  endpoint-encryption-key: ${NOTIFICATION_ENDPOINT_ENCRYPTION_KEY}
  # Independent HMAC secret for idempotency and destination digests; never reuse the AES key.
  idempotency-secret: ${NOTIFICATION_IDEMPOTENCY_SECRET}
  inbound-request-timeout: ${NOTIFICATION_INBOUND_REQUEST_TIMEOUT:30s}
  providers:
    # Opt-in local delivery records a deterministic provider ID and never contacts an external
    # provider. Production defaults remain fail-closed until Email/Push endpoints are configured.
    local-development-enabled: ${NOTIFICATION_LOCAL_DEVELOPMENT_PROVIDERS:false}
  delivery:
    worker-enabled: ${NOTIFICATION_DELIVERY_WORKER_ENABLED:true}
    max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
    initial-backoff: ${NOTIFICATION_DELIVERY_INITIAL_BACKOFF:1s}
    max-backoff: ${NOTIFICATION_DELIVERY_MAX_BACKOFF:5m}
    provider-timeout: ${NOTIFICATION_PROVIDER_TIMEOUT:5s}
    batch-size: ${NOTIFICATION_DELIVERY_BATCH_SIZE:50}
    poll-delay: ${NOTIFICATION_DELIVERY_POLL_DELAY:1s}
    lease-duration: ${NOTIFICATION_DELIVERY_LEASE_DURATION:30s}
  outbox:
    relay-enabled: ${NOTIFICATION_OUTBOX_RELAY_ENABLED:true}
    batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:100}
    poll-delay: ${NOTIFICATION_OUTBOX_POLL_DELAY:1s}
    initial-backoff: ${NOTIFICATION_OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${NOTIFICATION_OUTBOX_MAX_BACKOFF:5m}
    lease-duration: ${NOTIFICATION_OUTBOX_LEASE_DURATION:30s}
  stream:
    max-connections-per-account: ${NOTIFICATION_STREAM_MAX_CONNECTIONS_PER_ACCOUNT:3}
    queue-capacity: ${NOTIFICATION_STREAM_QUEUE_CAPACITY:100}
    replay-limit: ${NOTIFICATION_STREAM_REPLAY_LIMIT:100}
    heartbeat-interval: ${NOTIFICATION_STREAM_HEARTBEAT_INTERVAL:15s}
    connection-timeout: ${NOTIFICATION_STREAM_CONNECTION_TIMEOUT:30m}
  kafka:
    consumer-enabled: ${NOTIFICATION_KAFKA_CONSUMER_ENABLED:true}
    consumer-group: ${NOTIFICATION_KAFKA_CONSUMER_GROUP:notification-service-v1}
    # Each replica must receive delivery-status fanout for only its own bounded SSE sessions. The
    # group is derived in code from this required, pod/instance-specific identity; callers cannot
    # configure a shared realtime group accidentally. Kubernetes supplies a unique HOSTNAME, while
    # local deployments set NOTIFICATION_INSTANCE_ID explicitly.
    realtime-consumer-enabled: ${NOTIFICATION_KAFKA_REALTIME_CONSUMER_ENABLED:true}
    realtime-instance-id: ${NOTIFICATION_INSTANCE_ID:${HOSTNAME:}}

identity:
  base-url: ${LIFEOS_IDENTITY_BASE_URL:http://localhost:8081}
  workload-identity: ${LIFEOS_WORKLOAD_IDENTITY:notification-service}
  workload-token: ${IDENTITY_NOTIFICATION_WORKLOAD_TOKEN}
  connect-timeout: ${NOTIFICATION_IDENTITY_CONNECT_TIMEOUT:2s}
  read-timeout: ${NOTIFICATION_IDENTITY_READ_TIMEOUT:3s}

management:
  server:
    port: ${NOTIFICATION_MANAGEMENT_PORT:9084}
    address: ${NOTIFICATION_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
