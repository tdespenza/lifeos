name: Release

# Runs after CI succeeds on main, not on every push to main directly. A
# release must never ship off an unverified build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize all main releases. Grouping by SHA allowed two main commits with
# the same project version to race on the same tag.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # workflow_run executes with this workflow's write-scoped token even when
    # CI was started by a pull request. Only an actual push to this repository's
    # main branch may reach the privileged release path.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read and validate project version
        id: gate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          write_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          VERSION=$(bash scripts/release-version.sh read build.gradle.kts)
          write_output "version=$VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            write_output "stable=false" "tag_needed=false" "release_needed=false" "should_sync=false"
            echo "Skipping $VERSION: development versions are not released."
            exit 0
          fi

          bash scripts/release-version.sh compare "$VERSION" "$VERSION" >/dev/null
          git fetch origin --tags --force
          TAG_SHA=""
          if TAG_SHA=$(git rev-list -n1 "v$VERSION" 2>/dev/null); then
            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              echo "::error::tag v$VERSION already points to $TAG_SHA, not the verified main commit $HEAD_SHA"
              exit 1
            fi
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          LATEST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v$VERSION$" | sort -V | tail -n1 || true)
          LATEST_VERSION="${LATEST_TAG#v}"
          if [[ "$TAG_EXISTS" == false && -n "$LATEST_VERSION" && "$(bash scripts/release-version.sh compare "$VERSION" "$LATEST_VERSION")" != "1" ]]; then
            echo "::error::version v$VERSION is not greater than the latest release v$LATEST_VERSION"
            exit 1
          fi

          if gh release view "v$VERSION" --json tagName >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
          fi

          NEXT_SNAPSHOT=$(bash scripts/release-version.sh next-snapshot "$VERSION")
          write_output "stable=true"
          write_output "tag_needed=$([[ "$TAG_EXISTS" == false ]] && echo true || echo false)"
          write_output "release_needed=$([[ "$RELEASE_EXISTS" == false ]] && echo true || echo false)"
          write_output "should_sync=true" "next_snapshot=$NEXT_SNAPSHOT"
          echo "Release v$VERSION: tag_needed=$([[ "$TAG_EXISTS" == false ]] && echo true || echo false), release_needed=$([[ "$RELEASE_EXISTS" == false ]] && echo true || echo false)"

      - name: Tag release
        if: steps.gate.outputs.tag_needed == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.gate.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target "$HEAD_SHA" \
            --generate-notes

      - name: Open dev synchronization PR
        if: steps.gate.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
          NEXT_SNAPSHOT: ${{ steps.gate.outputs.next_snapshot }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin dev main
          if git merge-base --is-ancestor "$HEAD_SHA" origin/dev; then
            echo "dev already contains the verified release commit; nothing to sync."
            exit 0
          fi
          CURRENT_MAIN_SHA=$(git rev-parse origin/main)
          if [[ "$CURRENT_MAIN_SHA" != "$HEAD_SHA" ]]; then
            echo "::warning::origin/main ($CURRENT_MAIN_SHA) moved past the verified commit ($HEAD_SHA); skipping synchronization for this run."
            exit 0
          fi

          SYNC_BRANCH="automation/sync-v$VERSION-to-dev"
          MERGED_SYNC_PR=$(gh pr list --base dev --head "$SYNC_BRANCH" --state merged --json number,url --jq '.[0] | "\(.number) \(.url)"' || true)
          if [[ -n "$MERGED_SYNC_PR" ]]; then
            echo "Dev synchronization PR was already merged: $MERGED_SYNC_PR"
            exit 0
          fi
          EXISTING_PR=$(gh pr list --base dev --head "$SYNC_BRANCH" --state open --json number,url --jq '.[0] | "\(.number) \(.url)"' || true)
          if [[ -n "$EXISTING_PR" ]]; then
            echo "Dev synchronization PR already exists: $EXISTING_PR"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            echo "::error::remote branch $SYNC_BRANCH already exists without an open synchronization PR"
            exit 1
          fi

          git switch --create "$SYNC_BRANCH" origin/dev
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t CONFLICT_FILES < <(git diff --name-only --diff-filter=U)
            if [[ "${#CONFLICT_FILES[@]}" -ne 1 || "${CONFLICT_FILES[0]}" != "build.gradle.kts" ]]; then
              git merge --abort
              echo "::error::main-to-dev synchronization has conflicts outside build.gradle.kts; resolve this release sync manually"
              exit 1
            fi
            # The version line is intentionally rewritten below. Keep dev's
            # copy so unrelated development-only Gradle changes are preserved.
            git checkout --ours -- build.gradle.kts
            git add build.gradle.kts
          fi
          bash scripts/release-version.sh set build.gradle.kts "$NEXT_SNAPSHOT"
          git diff --check
          git add build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: start development after v$VERSION"
          git push --set-upstream origin "$SYNC_BRANCH"
          gh pr create \
            --base dev \
            --head "$SYNC_BRANCH" \
            --title "Sync v$VERSION and start $NEXT_SNAPSHOT development" \
            --body "Automated post-release synchronization. This PR brings the verified v$VERSION main commit back into dev and advances the Gradle version to $NEXT_SNAPSHOT. The PR is intentionally reviewable because main and dev are squash-merged rather than fast-forwarded."
