spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${IDENTITY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifeos_identity}
    username: ${IDENTITY_DATASOURCE_USERNAME:lifeos}
    password: ${IDENTITY_DATASOURCE_PASSWORD:lifeos}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      connect-timeout: ${IDENTITY_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${IDENTITY_REDIS_COMMAND_TIMEOUT:1s}

identity:
  auth:
    # Only list immediate load-balancer/proxy addresses here. Forwarded headers from all other
    # peers are ignored by ClientAddressResolver to prevent client-controlled audit fingerprints.
    trusted-proxy-addresses: []
    access-token-ttl: ${IDENTITY_ACCESS_TOKEN_TTL:PT5M}
    max-sessions-per-account: ${IDENTITY_MAX_SESSIONS_PER_ACCOUNT:10}
    rate-limit:
      max-attempts: ${IDENTITY_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${IDENTITY_LOGIN_RATE_LIMIT_WINDOW:PT1M}
    password:
      memory-k-i-b: ${IDENTITY_ARGON2_MEMORY_KIB:19456}
      iterations: ${IDENTITY_ARGON2_ITERATIONS:2}
      parallelism: ${IDENTITY_ARGON2_PARALLELISM:1}
      max-concurrent-verifications: ${IDENTITY_ARGON2_MAX_CONCURRENT:16}
      verification-acquire-timeout: ${IDENTITY_ARGON2_ACQUIRE_TIMEOUT:250ms}
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER:lifeos-identity}
      signing-secret: ${IDENTITY_JWT_SIGNING_SECRET:}
    fingerprint:
      audit-client-fingerprint-secret: ${IDENTITY_AUDIT_CLIENT_FINGERPRINT_SECRET:}
      rate-limit-key-secret: ${IDENTITY_RATE_LIMIT_KEY_SECRET:}
    oidc:
      callback-state-ttl: ${IDENTITY_OIDC_CALLBACK_STATE_TTL:PT5M}
      provider-connect-timeout: ${IDENTITY_OIDC_PROVIDER_CONNECT_TIMEOUT:PT2S}
      provider-read-timeout: ${IDENTITY_OIDC_PROVIDER_READ_TIMEOUT:PT5S}
      # Providers are intentionally empty by default. Deployments must explicitly configure
      # each allow-listed provider and its secret-manager-backed client credentials.
      providers: {}

server:
  port: 8081

management:
  server:
    port: ${IDENTITY_MANAGEMENT_PORT:9081}
    address: ${IDENTITY_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
