spring:
  datasource:
    url: jdbc:h2:mem:analytics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: test-password
  flyway:
    locations: classpath:db/migration-h2
  kafka:
    listener:
      auto-startup: false

analytics:
  gateway-proof-secret: test-gateway-proof-secret
  workload-token: test-analytics-workload-token
  kafka-enabled: false
