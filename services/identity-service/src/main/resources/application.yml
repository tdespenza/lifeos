spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${IDENTITY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifeos_identity}
    username: ${IDENTITY_DATASOURCE_USERNAME:lifeos}
    password: ${IDENTITY_DATASOURCE_PASSWORD:lifeos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Existing Hibernate-managed installations must enable this only for their first controlled
    # migration after taking a verified backup; see docs/operations/database-migrations.md.
    baseline-on-migrate: ${IDENTITY_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${IDENTITY_FLYWAY_BASELINE_VERSION:1}
    validate-migration-naming: true
  data:
    redis:
      connect-timeout: ${IDENTITY_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${IDENTITY_REDIS_COMMAND_TIMEOUT:1s}

identity:
  auth:
    # Only list immediate load-balancer/proxy addresses here. Forwarded headers from all other
    # peers are ignored by ClientAddressResolver to prevent client-controlled audit fingerprints.
    trusted-proxy-addresses: []
    access-token-ttl: ${IDENTITY_ACCESS_TOKEN_TTL:PT5M}
    max-sessions-per-account: ${IDENTITY_MAX_SESSIONS_PER_ACCOUNT:10}
    rate-limit:
      max-attempts: ${IDENTITY_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${IDENTITY_LOGIN_RATE_LIMIT_WINDOW:PT1M}
    password:
      memory-k-i-b: ${IDENTITY_ARGON2_MEMORY_KIB:19456}
      iterations: ${IDENTITY_ARGON2_ITERATIONS:2}
      parallelism: ${IDENTITY_ARGON2_PARALLELISM:1}
      max-concurrent-verifications: ${IDENTITY_ARGON2_MAX_CONCURRENT:16}
      verification-acquire-timeout: ${IDENTITY_ARGON2_ACQUIRE_TIMEOUT:250ms}
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER:lifeos-identity}
      audience: ${IDENTITY_JWT_AUDIENCE:lifeos}
      signing-key-id: ${IDENTITY_JWT_SIGNING_KEY_ID:lifeos-identity}
      # RSA PEM values are the production path. The HMAC secret remains as a compatibility path
      # for local/test deployments and must never be shared with downstream verifiers.
      signing-secret: ${IDENTITY_JWT_SIGNING_SECRET:}
      private-key-pem: ${IDENTITY_JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${IDENTITY_JWT_PUBLIC_KEY_PEM:}
      # Must be an independent secret with at least 32 UTF-8 bytes; it is never derived from JWT keys.
      replay-encryption-secret: ${IDENTITY_REFRESH_REPLAY_ENCRYPTION_SECRET:}
      refresh-token-ttl: ${IDENTITY_REFRESH_TOKEN_TTL:P30D}
      refresh-family-ttl: ${IDENTITY_REFRESH_FAMILY_TTL:P90D}
      refresh-idle-ttl: ${IDENTITY_REFRESH_IDLE_TTL:P14D}
      refresh-replay-ttl: ${IDENTITY_REFRESH_REPLAY_TTL:PT30S}
      max-refresh-replay-records-per-family: ${IDENTITY_MAX_REFRESH_REPLAY_RECORDS:64}
      clock-skew: ${IDENTITY_JWT_CLOCK_SKEW:PT60S}
    fingerprint:
      audit-client-fingerprint-secret: ${IDENTITY_AUDIT_CLIENT_FINGERPRINT_SECRET:}
      rate-limit-key-secret: ${IDENTITY_RATE_LIMIT_KEY_SECRET:}
    authorization:
      policy-version: ${IDENTITY_AUTHORIZATION_POLICY_VERSION:v1}
      workload-rate-limit:
        # Internal protected-service traffic has its own budget; never reuse the credential
        # login attempt limit, which would throttle normal authorized application traffic.
        max-requests: ${IDENTITY_WORKLOAD_RATE_LIMIT_MAX_REQUESTS:60000}
        window: ${IDENTITY_WORKLOAD_RATE_LIMIT_WINDOW:PT1M}
      # Internal adapters deny every caller until its deployment-managed workload secret is set.
      # Production traffic must also be isolated behind TLS/mTLS or an equivalent service mesh.
      workload-identities:
        task-goal-service: ${IDENTITY_TASK_GOAL_WORKLOAD_TOKEN:}
    oidc:
      callback-state-ttl: ${IDENTITY_OIDC_CALLBACK_STATE_TTL:PT5M}
      provider-connect-timeout: ${IDENTITY_OIDC_PROVIDER_CONNECT_TIMEOUT:PT2S}
      provider-read-timeout: ${IDENTITY_OIDC_PROVIDER_READ_TIMEOUT:PT5S}
      # Providers are intentionally empty by default. Deployments must explicitly configure
      # each allow-listed provider and its secret-manager-backed client credentials.
      providers: {}
    webauthn:
      challenge-ttl: ${IDENTITY_WEBAUTHN_CHALLENGE_TTL:PT5M}
      rp-id: ${IDENTITY_WEBAUTHN_RP_ID:localhost}
      rp-name: ${IDENTITY_WEBAUTHN_RP_NAME:LifeOS}
      allowed-origins: ${IDENTITY_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:4200}
      user-verification: ${IDENTITY_WEBAUTHN_USER_VERIFICATION:REQUIRED}

server:
  port: 8081

management:
  server:
    port: ${IDENTITY_MANAGEMENT_PORT:9081}
    address: ${IDENTITY_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
