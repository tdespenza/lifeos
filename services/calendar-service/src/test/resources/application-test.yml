spring:
  datasource:
    url: jdbc:h2:mem:calendar-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration-h2

calendar:
  idempotency-secret: calendar-test-idempotency-secret-with-32-bytes
  audit-client-fingerprint-secret: calendar-test-audit-fingerprint-secret
  recurrence:
    materializer-enabled: false
  reminders:
    scheduler-enabled: false
  outbox:
    relay-enabled: false

identity:
  workload-token: calendar-test-workload-token
