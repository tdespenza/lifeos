services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local development still requires caller-supplied credentials; never bake a reusable
      # database password into source control. Copy .env.example to .env before starting.
      POSTGRES_USER: ${LIFEOS_POSTGRES_USER:?Set LIFEOS_POSTGRES_USER in infrastructure/docker-compose/.env}
      POSTGRES_PASSWORD: ${LIFEOS_POSTGRES_PASSWORD:?Set LIFEOS_POSTGRES_PASSWORD in infrastructure/docker-compose/.env}
      POSTGRES_DB: ${LIFEOS_POSTGRES_DB:-lifeos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local vector store for the Document Vault/AI grounding slice. It is deliberately
  # loopback-only and unauthenticated for local development; production must use a private,
  # authenticated Qdrant deployment and set QDRANT_API_KEY in service secrets.
  qdrant:
    image: qdrant/qdrant:v1.14.1
    profiles: ["vector"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  # Optional local-only MongoDB for encrypted assistant conversation history. It is loopback-only
  # and intentionally unauthenticated for development; production must use authenticated TLS,
  # private networking, backups, and a managed secret for the AES-256 application key.
  mongo:
    image: mongo:8.0
    profiles: ["mongo"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  # Local-only Kafka KRaft reference broker for Calendar and Notification development. It is not a
  # production topology: it uses one plaintext broker, no ACLs, and finite development retention.
  # Production must provision TLS, authentication/ACLs, replication, topic retention, and backup.
  kafka:
    image: apache/kafka:4.3.1
    profiles: ["eventing"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Topic creation is explicit so applications cannot accidentally create misspelled topics. The
  # ephemeral initializer is local development scaffolding; production topic ACLs/retention are
  # provisioned by the platform deployment, not an application container.
  kafka-topic-init:
    image: apache/kafka:4.3.1
    profiles: ["eventing"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in \
          lifeos.notification.requested.v1 \
          lifeos.notification.requested.v1.DLT \
          lifeos.notification.requested.v2 \
          lifeos.notification.requested.v2.DLT \
          lifeos.notification.delivery-status.v1 \
          lifeos.document.proof.requested.v1 \
          lifeos.document.proof.requested.v1.DLT; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=604800000
        done

  # Local-only private Besu development node. The `dev` network is intentionally single-node and
  # must never be used as a production consensus topology. The checked-in contract source and
  # deployment helper provision only digest/minimal metadata; no document bytes enter the chain.
  besu:
    image: hyperledger/besu:26.7.1
    profiles: ["blockchain"]
    command:
      - "--network=dev"
      - "--data-path=/var/lib/besu"
      - "--rpc-http-enabled"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-http-api=ETH,NET,WEB3,TXPOOL"
      - "--host-allowlist=*"
      - "--min-gas-price=0"
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - besu-data:/var/lib/besu

  # This profile is deliberately separate from the default PostgreSQL/Redis developer path.
  # It is a local-only reference stack; production must supply managed credentials,
  # retention, backups, TLS, and network policy before exposing any of these components.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks: [observability]
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # Docker Desktop resolves this name natively; the host-gateway mapping keeps the same local
    # profile usable on Linux where it is not created automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [observability]

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [observability]

  tempo:
    image: grafana/tempo:2.7.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ../observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks: [observability]

  promtail:
    image: grafana/promtail:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ../observability/promtail/config.yaml:/etc/promtail/config.yaml:ro
      # Host-run Spring Boot services write their ECS stdout here in the documented local flow.
      - ${LIFEOS_OBSERVABILITY_LOG_DIRECTORY:-/tmp/lifeos-observability}:/var/log/lifeos:ro
      # The local profile discovers only explicitly labelled LifeOS containers. The Docker socket
      # is intentionally unavailable to the production deployment model; see the runbook.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/var/lib/promtail
    networks: [observability]
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Compose expands every service, including inactive profiles. The runtime command below
      # still fails closed when the observability profile actually starts Grafana without this.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_ADMIN_PASSWORD must be set before starting the observability profile" >&2
          exit 64
        fi
        exec /run.sh
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [observability]
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  loki-data:
  tempo-data:
  promtail-positions:
  grafana-data:
  qdrant-data:
  mongo-data:
  besu-data:

networks:
  observability:
    name: lifeos-observability
