spring:
  application:
    name: finance-service
  threads:
    virtual:
      enabled: true
  datasource:
    # Production values intentionally have no source-controlled fallback. Missing deployment
    # secrets fail property binding before a JDBC pool or Flyway migration is started.
    url: ${FINANCE_DATASOURCE_URL}
    username: ${FINANCE_DATASOURCE_USERNAME}
    password: ${FINANCE_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FINANCE_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FINANCE_FLYWAY_BASELINE_VERSION:1}
    validate-migration-naming: true

server:
  port: ${FINANCE_SERVICE_PORT:8086}

grpc:
  server:
    enabled: ${FINANCE_GRPC_ENABLED:false}
    port: ${FINANCE_GRPC_PORT:10086}
    tls-enabled: ${FINANCE_GRPC_TLS_ENABLED:false}
    certificate-chain: ${FINANCE_GRPC_CERTIFICATE_CHAIN:}
    private-key: ${FINANCE_GRPC_PRIVATE_KEY:}
    trust-certificate-collection: ${FINANCE_GRPC_TRUST_CERTIFICATE_COLLECTION:}
    workload-token: ${FINANCE_GRPC_WORKLOAD_TOKEN:}

finance:
  inbound-request-timeout: ${FINANCE_INBOUND_REQUEST_TIMEOUT:10s}
  max-inbound-body-bytes: ${FINANCE_MAX_INBOUND_BODY_BYTES:65536}
  max-concurrent-requests: ${FINANCE_MAX_CONCURRENT_REQUESTS:128}
  idempotency-secret: ${FINANCE_IDEMPOTENCY_SECRET}
  audit-client-fingerprint-secret: ${FINANCE_AUDIT_CLIENT_FINGERPRINT_SECRET}
  assistant-projection:
    workload-identity: ${FINANCE_ASSISTANT_PROJECTION_WORKLOAD_IDENTITY:ai-assistant-service}
    workload-token: ${FINANCE_AI_ASSISTANT_WORKLOAD_TOKEN:}

identity:
  # Identity only permits HTTP for loopback development. Production authority calls are HTTPS.
  base-url: ${LIFEOS_IDENTITY_BASE_URL:http://localhost:8081}
  workload-identity: ${LIFEOS_WORKLOAD_IDENTITY:finance-service}
  workload-token: ${IDENTITY_FINANCE_WORKLOAD_TOKEN}
  expected-policy-version: ${LIFEOS_AUTHORIZATION_POLICY_VERSION:v2}
  connect-timeout: ${FINANCE_IDENTITY_CONNECT_TIMEOUT:2s}
  read-timeout: ${FINANCE_IDENTITY_READ_TIMEOUT:3s}
  max-concurrent-requests: ${FINANCE_IDENTITY_MAX_CONCURRENT_REQUESTS:32}

management:
  server:
    port: ${FINANCE_MANAGEMENT_PORT:9086}
    address: ${FINANCE_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
