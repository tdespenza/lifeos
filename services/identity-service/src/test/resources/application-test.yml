spring:
  datasource:
    url: jdbc:h2:mem:identity-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  server:
    # Use a separate ephemeral management listener so these tests verify the production topology.
    port: 0
  tracing:
    enabled: false

identity:
  auth:
    jwt:
      issuer: lifeos-identity-test
      signing-secret: test-only-secret-that-is-at-least-32-bytes-long
