name: Release

# Runs after CI succeeds on main, not on every push to main directly — a release
# must never ship off an unverified build. See CONTRIBUTING.md § Branching model.
#
# workflow_run always executes with this repo's write-scoped token and secrets,
# regardless of what triggered the upstream CI run — including a CI run started
# by a pull_request from a fork. The job condition below requires the
# triggering run to be a `push` event (not `pull_request`) on this repository
# specifically, so a fork cannot get a branch it controls (e.g. one it names
# "main") to run this workflow with our permissions.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read project version
        id: version
        run: |
          VERSION=$(grep -m1 -E '^\s*version = "' build.gradle.kts | sed -E 's/.*version = "([^"]+)".*/\1/')
          if [[ -z "$VERSION" ]]; then
            echo "::error::could not parse version from build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether this is a release
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: version $VERSION is a SNAPSHOT, not a release."
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: tag v$VERSION already exists."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target "$HEAD_SHA" \
            --generate-notes

      # Requires the repo's "Allow GitHub Actions to create and approve pull
      # requests" setting (Settings > Actions > General) to be enabled — the
      # `permissions: pull-requests: write` block above scopes what the token
      # is *allowed* to do, but that separate repo-level toggle gates whether
      # GITHUB_TOKEN can call the PR-creation API at all. This PR also gets no
      # independent CI run of its own: GitHub Actions does not trigger
      # pull_request-triggered workflows for PRs opened by GITHUB_TOKEN. Its
      # content already passed CI on main, so this is a lower-risk gap than it
      # would be for arbitrary new code, but it means the merge decision here
      # relies on human review, not an automated check.
      - name: Open dev sync-back PR
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin dev main
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already contains this release commit; nothing to sync."
            exit 0
          fi
          if ! pr_output=$(gh pr create \
            --base dev \
            --head main \
            --title "Sync dev with v$VERSION release" \
            --body "Automated sync-back after the v$VERSION release (see CONTRIBUTING.md § Branching model — squash-merge-only means this can't be a fast-forward). This PR carries no independent CI run of its own: GitHub Actions does not trigger workflows for PRs opened by the default GITHUB_TOKEN. Its content already passed CI on main." 2>&1); then
            if echo "$pr_output" | grep -qi "already exists"; then
              echo "A sync PR is already open for this release; nothing to do."
              exit 0
            fi
            echo "::error::gh pr create failed: $pr_output"
            exit 1
          fi
          echo "$pr_output"
