name: CI

on:
  # Run the required quality gates for every branch change. Protected-branch deployment
  # remains separately gated below, but feature branches must still receive feedback.
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install SBOM schema validator
        run: npm ci --ignore-scripts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Compile and run tests
        run: ./gradlew build

      - name: Test release version helper
        run: bash scripts/test-release-version.sh

      - name: Test operational script behavior
        run: bash scripts/test-operational-scripts.sh

      - name: Test concurrent database provisioning
        run: bash scripts/test-provision-databases-concurrency.sh

      - name: Verify operational script syntax
        run: bash scripts/verify-pipeline-scripts.sh

      - name: Test SBOM validator
        run: bash scripts/test-verify-sbom.sh

      - name: Generate and validate CycloneDX SBOM
        run: |
          ./gradlew cyclonedxBom
          bash scripts/verify-sbom.sh
