spring:
  application:
    name: document-vault-service
  threads:
    virtual:
      enabled: true
  datasource:
    # There is intentionally no embedded/shared production fallback for protected document metadata.
    url: ${DOCUMENT_VAULT_DATASOURCE_URL}
    username: ${DOCUMENT_VAULT_DATASOURCE_USERNAME}
    password: ${DOCUMENT_VAULT_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${DOCUMENT_VAULT_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${DOCUMENT_VAULT_FLYWAY_BASELINE_VERSION:1}
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${LIFEOS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
  servlet:
    multipart:
      # Servlet limits are admission control; LocalDocumentObjectStore independently verifies bytes.
      resolve-lazily: true
      max-file-size: ${DOCUMENT_VAULT_MULTIPART_MAX_FILE_SIZE:10485760B}
      max-request-size: ${DOCUMENT_VAULT_MULTIPART_MAX_REQUEST_SIZE:11010048B}

server:
  port: ${DOCUMENT_VAULT_SERVICE_PORT:8088}

document-vault:
  inbound-request-timeout: ${DOCUMENT_VAULT_INBOUND_REQUEST_TIMEOUT:30s}
  upload-deadline: ${DOCUMENT_VAULT_UPLOAD_DEADLINE:30s}
  max-upload-bytes: ${DOCUMENT_VAULT_MAX_UPLOAD_BYTES:10485760}
  max-inbound-body-bytes: ${DOCUMENT_VAULT_MAX_INBOUND_BODY_BYTES:11010048}
  max-concurrent-requests: ${DOCUMENT_VAULT_MAX_CONCURRENT_REQUESTS:64}
  max-search-catalog-entries: ${DOCUMENT_VAULT_MAX_SEARCH_CATALOG_ENTRIES:10000}
  # Deployment-only HMAC secrets. Raw idempotency keys, raw addresses, and document bytes never
  # enter Postgres, structured logs, trace attributes, or metric labels.
  idempotency-secret: ${DOCUMENT_VAULT_IDEMPOTENCY_SECRET}
  audit-client-fingerprint-secret: ${DOCUMENT_VAULT_AUDIT_CLIENT_FINGERPRINT_SECRET}
  storage:
    # LOCAL_DEVELOPMENT is intentionally explicit. Production must inject a reviewed adapter.
    mode: ${DOCUMENT_VAULT_STORAGE_MODE:LOCAL_DEVELOPMENT}
    local-root: ${DOCUMENT_VAULT_LOCAL_STORAGE_ROOT:./var/document-vault-objects}
  ocr:
    # Disabled by default. Enabling requires a reviewed local Tesseract installation; no remote
    # OCR provider is contacted and OCR failure never makes a verified upload unavailable.
    enabled: ${DOCUMENT_VAULT_OCR_ENABLED:false}
    executable: ${DOCUMENT_VAULT_OCR_EXECUTABLE:tesseract}
    timeout: ${DOCUMENT_VAULT_OCR_TIMEOUT:5s}
    max-output-characters: ${DOCUMENT_VAULT_OCR_MAX_OUTPUT_CHARACTERS:65536}
  qdrant:
    enabled: ${DOCUMENT_VAULT_QDRANT_ENABLED:false}
    base-url: ${QDRANT_BASE_URL:http://localhost:6333}
    collection: ${QDRANT_COLLECTION:lifeos_documents_v1}
    api-key: ${QDRANT_API_KEY:}
    vector-size: ${QDRANT_VECTOR_SIZE:32}
    max-chunks-per-document: ${QDRANT_MAX_CHUNKS_PER_DOCUMENT:64}
    max-chunk-characters: ${QDRANT_MAX_CHUNK_CHARACTERS:1600}
    timeout: ${QDRANT_TIMEOUT:2s}
  proof-outbox:
    relay-enabled: ${DOCUMENT_VAULT_PROOF_OUTBOX_RELAY_ENABLED:true}
    batch-size: ${DOCUMENT_VAULT_PROOF_OUTBOX_BATCH_SIZE:50}
    max-concurrent-publishes: ${DOCUMENT_VAULT_PROOF_OUTBOX_MAX_CONCURRENT_PUBLISHES:4}
    max-attempts: ${DOCUMENT_VAULT_PROOF_OUTBOX_MAX_ATTEMPTS:10}
    poll-delay: ${DOCUMENT_VAULT_PROOF_OUTBOX_POLL_DELAY:1s}
    lease-duration: ${DOCUMENT_VAULT_PROOF_OUTBOX_LEASE_DURATION:30s}
    initial-backoff: ${DOCUMENT_VAULT_PROOF_OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${DOCUMENT_VAULT_PROOF_OUTBOX_MAX_BACKOFF:5m}

identity:
  # Authentication is wired to the V2 contract. Document action descriptors are intentionally
  # pending Identity ownership, so this service does not invent them locally.
  base-url: ${LIFEOS_IDENTITY_BASE_URL:http://localhost:8081}
  workload-identity: ${LIFEOS_WORKLOAD_IDENTITY:document-vault-service}
  workload-token: ${IDENTITY_DOCUMENT_VAULT_WORKLOAD_TOKEN}
  expected-policy-version: ${LIFEOS_AUTHORIZATION_POLICY_VERSION:v2}
  connect-timeout: ${DOCUMENT_VAULT_IDENTITY_CONNECT_TIMEOUT:2s}
  read-timeout: ${DOCUMENT_VAULT_IDENTITY_READ_TIMEOUT:3s}
  max-concurrent-requests: ${DOCUMENT_VAULT_IDENTITY_MAX_CONCURRENT_REQUESTS:32}

management:
  server:
    port: ${DOCUMENT_VAULT_MANAGEMENT_PORT:9088}
    address: ${DOCUMENT_VAULT_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
