spring:
  application:
    name: calendar-service
  threads:
    virtual:
      enabled: true
  datasource:
    # Calendar never falls back to an embedded or shared production database.
    url: ${CALENDAR_DATASOURCE_URL}
    username: ${CALENDAR_DATASOURCE_USERNAME}
    password: ${CALENDAR_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${CALENDAR_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${CALENDAR_FLYWAY_BASELINE_VERSION:1}
    validate-migration-naming: true
  kafka:
    bootstrap-servers: ${LIFEOS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000

server:
  port: ${CALENDAR_SERVICE_PORT:8085}

grpc:
  server:
    enabled: ${CALENDAR_GRPC_ENABLED:false}
    port: ${CALENDAR_GRPC_PORT:10085}
    tls-enabled: ${CALENDAR_GRPC_TLS_ENABLED:false}
    certificate-chain: ${CALENDAR_GRPC_CERTIFICATE_CHAIN:}
    private-key: ${CALENDAR_GRPC_PRIVATE_KEY:}
    trust-certificate-collection: ${CALENDAR_GRPC_TRUST_CERTIFICATE_COLLECTION:}
    workload-token: ${CALENDAR_GRPC_WORKLOAD_TOKEN:}

calendar:
  idempotency-secret: ${CALENDAR_IDEMPOTENCY_SECRET}
  audit-client-fingerprint-secret: ${CALENDAR_AUDIT_CLIENT_FINGERPRINT_SECRET}
  inbound-request-timeout: ${CALENDAR_INBOUND_REQUEST_TIMEOUT:10s}
  max-inbound-body-bytes: ${CALENDAR_MAX_INBOUND_BODY_BYTES:65536}
  max-concurrent-requests: ${CALENDAR_MAX_CONCURRENT_REQUESTS:128}
  recurrence:
    materializer-enabled: ${CALENDAR_RECURRENCE_MATERIALIZER_ENABLED:true}
    horizon-days: ${CALENDAR_RECURRENCE_HORIZON_DAYS:30}
    max-occurrences-per-event: ${CALENDAR_RECURRENCE_MAX_OCCURRENCES:100}
    batch-size: ${CALENDAR_RECURRENCE_BATCH_SIZE:50}
    poll-delay: ${CALENDAR_RECURRENCE_POLL_DELAY:1m}
  reminders:
    scheduler-enabled: ${CALENDAR_REMINDER_SCHEDULER_ENABLED:true}
    batch-size: ${CALENDAR_REMINDER_BATCH_SIZE:50}
    poll-delay: ${CALENDAR_REMINDER_POLL_DELAY:1s}
    lease-duration: ${CALENDAR_REMINDER_LEASE_DURATION:30s}
  outbox:
    relay-enabled: ${CALENDAR_OUTBOX_RELAY_ENABLED:true}
    batch-size: ${CALENDAR_OUTBOX_BATCH_SIZE:100}
    max-concurrent-publishes: ${CALENDAR_OUTBOX_MAX_CONCURRENT_PUBLISHES:16}
    poll-delay: ${CALENDAR_OUTBOX_POLL_DELAY:1s}
    lease-duration: ${CALENDAR_OUTBOX_LEASE_DURATION:30s}
    max-attempts: ${CALENDAR_OUTBOX_MAX_ATTEMPTS:10}
    initial-backoff: ${CALENDAR_OUTBOX_INITIAL_BACKOFF:1s}
    max-backoff: ${CALENDAR_OUTBOX_MAX_BACKOFF:5m}
  task-goal-projection:
    base-url: ${CALENDAR_TASK_GOAL_PROJECTION_BASE_URL:http://localhost:8082}
    workload-identity: ${CALENDAR_TASK_GOAL_PROJECTION_WORKLOAD_IDENTITY:calendar-service}
    workload-token: ${IDENTITY_CALENDAR_WORKLOAD_TOKEN:}
    connect-timeout: ${CALENDAR_TASK_GOAL_PROJECTION_CONNECT_TIMEOUT:2s}
    read-timeout: ${CALENDAR_TASK_GOAL_PROJECTION_READ_TIMEOUT:3s}

identity:
  base-url: ${LIFEOS_IDENTITY_BASE_URL:http://localhost:8081}
  workload-identity: ${LIFEOS_WORKLOAD_IDENTITY:calendar-service}
  workload-token: ${IDENTITY_CALENDAR_WORKLOAD_TOKEN}
  expected-policy-version: ${LIFEOS_AUTHORIZATION_POLICY_VERSION:v2}
  connect-timeout: ${CALENDAR_IDENTITY_CONNECT_TIMEOUT:2s}
  read-timeout: ${CALENDAR_IDENTITY_READ_TIMEOUT:3s}
  max-concurrent-requests: ${CALENDAR_IDENTITY_MAX_CONCURRENT_REQUESTS:32}

management:
  server:
    port: ${CALENDAR_MANAGEMENT_PORT:9085}
    address: ${CALENDAR_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    prometheus:
      access: unrestricted
    health:
      access: unrestricted
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ecs
