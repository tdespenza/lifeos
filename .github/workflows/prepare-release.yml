name: Prepare Release

# A release request can be made either by adding exactly one release label to
# a merged PR on dev, or by using workflow_dispatch. The workflow creates the
# Git Flow release branch and PR; main remains protected and is never bypassed.
on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer increment for the next release
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-preparation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    # Never run the write-capable path for an untrusted fork. The checkout is
    # always dev, but this guard prevents a fork from requesting a release.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          contains(join(github.event.pull_request.labels.*.name, ','), 'release:patch') ||
          contains(join(github.event.pull_request.labels.*.name, ','), 'release:minor') ||
          contains(join(github.event.pull_request.labels.*.name, ','), 'release:major')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up release request
        id: request
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          write_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          if [[ -n "$REQUESTED_BUMP" ]]; then
            BUMP="$REQUESTED_BUMP"
          else
            mapfile -t RELEASE_LABELS < <(jq -r '.[] | select(. == "release:patch" or . == "release:minor" or . == "release:major")' <<<"$LABELS_JSON")
            if [[ "${#RELEASE_LABELS[@]}" -ne 1 ]]; then
              echo "::error::exactly one of release:patch, release:minor, or release:major is required"
              exit 1
            fi
            BUMP="${RELEASE_LABELS[0]#release:}"
          fi
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "::error::invalid release bump '$BUMP'"; exit 1 ;;
          esac
          write_output "bump=$BUMP"

      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ steps.request.outputs.bump }}
        run: |
          set -euo pipefail
          write_output() {
            printf '%s\n' "$@" >> "$GITHUB_OUTPUT"
          }
          git fetch origin dev --tags --force
          CURRENT_VERSION=$(bash scripts/release-version.sh read build.gradle.kts)
          LATEST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          LATEST_VERSION="${LATEST_TAG#v}"
          VERSION=$(bash scripts/release-version.sh next "$CURRENT_VERSION" "$BUMP" "$LATEST_VERSION")
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::release tag v$VERSION already exists"
            exit 1
          fi
          write_output "version=$VERSION"
          write_output "current=$CURRENT_VERSION"
          write_output "latest=${LATEST_VERSION:-none}"
          echo "Preparing v$VERSION from $CURRENT_VERSION (latest tag: ${LATEST_VERSION:-none})"

      - name: Create release branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v$VERSION"
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json number,url --jq '.[0] | "\(.number) \(.url)"' || true)
          if [[ -n "$EXISTING_PR" ]]; then
            echo "Release PR already exists: $EXISTING_PR"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::remote branch $BRANCH already exists without an open release PR"
            exit 1
          fi

          git switch --create "$BRANCH" origin/dev
          bash scripts/release-version.sh set build.gradle.kts "$VERSION"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "chore(release): prepare v$VERSION"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open release PR into main
        if: steps.branch.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.request.outputs.bump }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release v$VERSION" \
            --body "Automated Git Flow release preparation. This PR promotes the verified dev state to main, sets the project version to v$VERSION, and will trigger the verified-main release workflow after merge. Requested SemVer bump: $BUMP."
